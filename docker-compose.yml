services:
  backend:
    build:
      context: .
    restart: unless-stopped
    volumes:
      - openshorts-output:/app/output

  frontend:
    build:
      context: ./dashboard
      target: prod
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    restart: unless-stopped
    volumes:
      - openshorts-output:/output
    environment:
      REMOTION_BUNDLE_PATH: /app/remotion
      OUTPUT_DIR: /output
      PORT: "3100"
    depends_on:
      - backend

volumes:
  openshorts-output:
