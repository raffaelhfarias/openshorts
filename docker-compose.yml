services:
  backend:
    build:
      context: .
    container_name: openshorts-backend
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: openshorts-frontend
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    volumes:
      - ./output:/output
    environment:
      REMOTION_BUNDLE_PATH: /app/remotion
      OUTPUT_DIR: /output
      PORT: "3100"
    restart: unless-stopped
    depends_on:
      - backend
